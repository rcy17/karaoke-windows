name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / native Python and JavaScript
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install native dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci
      - name: Install test media tools
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest https://www.rarewares.org/files/mp3/lame3.100-libsndfile-64.zip -OutFile "$env:RUNNER_TEMP/lame.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/ffmpeg.zip").Hash -ne '60F467265B1E312373DBCD92200C2618A74850F98D3D078E94296BB3FA2047BA') { throw 'FFmpeg archive changed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/lame.zip").Hash -ne '89CF8A735D13592282E849D64B974F1E4605DF28BC4BECEAAC911178B1A00C3F') { throw 'LAME archive changed' }
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg"
          Expand-Archive "$env:RUNNER_TEMP/lame.zip" "$env:RUNNER_TEMP/lame"
          "$env:RUNNER_TEMP/ffmpeg/ffmpeg-9.0.2-essentials_build/bin" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP/lame" >> $env:GITHUB_PATH
          Invoke-WebRequest https://raw.githubusercontent.com/notofonts/noto-cjk/main/Serif/OTC/NotoSerifCJK-Regular.ttc -OutFile "$env:RUNNER_TEMP/NotoSerifCJK-Regular.ttc"
          "KARAOKE_FONT_FILE=$env:RUNNER_TEMP/NotoSerifCJK-Regular.ttc" >> $env:GITHUB_ENV
      - name: Check out the pinned pronunciation dictionary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiuqiao/SOFA
          ref: 9549c6a86d16019c817eefe4bb8183405da524cc
          path: karaoke/research/subtitles-2026-09-18/sofa
          persist-credentials: false
      - name: Check all source
        run: |
          ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ty check --python (Get-Command python).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run lint
      - name: Run Python tests including empty-library startup
        env:
          PYTHONPATH: karaoke
        run: python -m pytest -q karaoke/test_api.py karaoke/test_room.py karaoke/test_algorithms.py --junitxml=test-results/windows.xml --basetemp="${{ runner.temp }}/karaoke-tests"
      - name: Run JavaScript tests
        run: node --test karaoke/test_player.mjs karaoke/test_pitch.mjs karaoke/test_search.mjs
      - name: Save Windows test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results
          path: test-results/
          retention-days: 14

  lint:
    name: Python / Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lint.txt
      - run: ruff check .

  types:
    name: Python / ty
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            karaoke/requirements*.txt
            .github/workflows/tests.yml
      - name: Install Python dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check all Python types
        run: ty check --python "$(command -v python)"

  python:
    name: Python / API, queue and algorithms
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      KARAOKE_FONT_FILE: /usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            karaoke/requirements*.txt
            .github/workflows/tests.yml
      - name: Install audio tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg lame libsndfile1 fonts-noto-cjk
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchaudio==2.11.0
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check out the pinned pronunciation dictionary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiuqiao/SOFA
          ref: 9549c6a86d16019c817eefe4bb8183405da524cc
          path: karaoke/research/subtitles-2026-09-18/sofa
          persist-credentials: false
      - name: Prepare the Japanese pronunciation dictionary
        run: python -c 'import pyopenjtalk; pyopenjtalk.run_frontend("こんにちは")'
      - name: Check startup with an empty library
        env:
          KARAOKE_DATA_DIR: ${{ runner.temp }}/karaoke-empty
          KARAOKE_PORT: "8746"
        run: |
          mkdir -p test-results
          python -m karaoke.api >test-results/startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          python - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          def get(path):
              with urlopen("http://127.0.0.1:8746" + path, timeout=2) as response:
                  return response.read()

          for attempt in range(30):
              try:
                  health = json.loads(get("/health"))
                  break
              except URLError:
                  time.sleep(1)
          else:
              raise RuntimeError("Server did not start within 30 seconds")
          assert health["queued"] == 0 and health["running_job"] is None
          assert json.loads(get("/v1/library"))["songs"] == []
          assert json.loads(get("/v1/room"))["entries"] == []
          assert b"<html" in get("/")
          PY
      - name: Run all Python tests
        env:
          PYTHONPATH: karaoke
        run: python -m pytest -q karaoke/test_api.py karaoke/test_room.py karaoke/test_algorithms.py --junitxml=test-results/python.xml --basetemp="${{ runner.temp }}/karaoke-tests"
      - name: Save Python test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-results
          path: |
            test-results/
            ${{ runner.temp }}/karaoke-tests/**/*.log
          retention-days: 14

  javascript:
    name: JavaScript / lint, player, pitch and search
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install lint dependencies
        run: npm ci
      - name: Check all owned JavaScript
        run: npm run lint
      - name: Run all JavaScript tests
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/javascript.xml karaoke/test_player.mjs karaoke/test_pitch.mjs karaoke/test_search.mjs
      - name: Save JavaScript test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-test-results
          path: test-results/
          retention-days: 14
